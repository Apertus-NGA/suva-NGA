[project]
name = "suva-nga"
version = "0.0.0"
description = "Case-law monitoring of the Swiss Federal Supreme Court for Suva, with Apertus (HackApertus Zurich 2026)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.9,<3",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["judgements"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
