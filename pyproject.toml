[project]
name = "suva-nga"
version = "0.0.0"
description = "Case-law monitoring of the Swiss Federal Supreme Court for Suva, with Apertus (HackApertus Zurich 2026)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.27,<1",
    "huggingface-hub>=2.5.0",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=22",
    "pydantic>=2.9,<3",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Installed as top-level packages, as on the branch they come from (the app imports `suva_data`, the
# summarizer imports `suva_app`). The rest of src/ is imported as `src.<package>` from the repo root.
packages = ["src/suva_data", "src/suva_app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["judgements"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and query parameters as call defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: needs the Postgres test database (docker compose up -d db)"]
