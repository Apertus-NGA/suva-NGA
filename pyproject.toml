[project]
name = "suva-nga"
version = "0.1.0"
description = "Case-law monitoring of the Swiss Federal Supreme Court for Suva, with Apertus (HackApertus Zurich 2026)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.27,<1",
    "huggingface-hub>=2.5.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=26.0.1",
    "pydantic>=2.9,<3",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.7",
]
research = [
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suva_data", "src/suva_app"]

[tool.uv]
# Keep the research packages installed whenever any session syncs the environment.
default-groups = ["dev", "research"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["judgements"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and query parameters as call defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: needs DATABASE_URL (PostgreSQL); creates and drops a throwaway database"]
