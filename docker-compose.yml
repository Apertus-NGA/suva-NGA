# Suva data layer: PostgreSQL 16 (docs/ARCHITECTURE.md, section 9).
#   docker compose up -d db
# The port is published on localhost only and matches config.DATABASE_URL
# (postgresql://postgres:suva@localhost:54329/suva).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: suva
      POSTGRES_DB: suva
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - suva_pgdata:/var/lib/postgresql/data
      # Files here (the published dump) are loaded by Postgres on FIRST start only (empty volume).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d suva"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # app: the application service (pipeline / later stages) goes here. It will use
  #   DATABASE_URL=postgresql://postgres:suva@db:5432/suva  and  depends_on: db (condition: service_healthy).

volumes:
  suva_pgdata:
