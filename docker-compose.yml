# Postgres with pgvector, and the app (docs/agents/platform.md step 9). Images pinned by digest.
# Usage: docker compose run --rm app make run   (or: docker compose up)
services:
  db:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    platform: linux/amd64
    environment:
      POSTGRES_DB: suva
      POSTGRES_USER: suva
      # Local, internal-only database: no port is published to the host, so no password is stored here.
      # On a shared host, set POSTGRES_PASSWORD in .env and drop this line.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suva -d suva"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    platform: linux/amd64
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://suva@db:5432/suva
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Suva-derived artefacts stay outside the image and outside git while D-031 is open.
      - ./data/derived:/app/data/derived
      - ./results:/app/results
    command: ["make", "run"]

volumes:
  pgdata:
