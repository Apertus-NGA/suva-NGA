# CI on every push and PR, on linux/amd64 (AGENTS.md §8; docs/agents/platform.md step 8).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-run:
    runs-on: ubuntu-latest  # linux/amd64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # full history (about 2.5 MB): tests/test_layer1_reference.py proves the vendored parity reference equals
          # `git show 4c246a8:src/courts.py`, and skips that check on a shallow clone
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install
        run: uv sync --frozen
      - name: make check (lint, unit, doctrine, models registry, template layout, D-051)
        run: make check
      - name: make run, stages that need no Suva-derived artefact (no key in CI)
        run: SERVE=0 MODE=replay make pipeline
      # Blocked by D-031 (hard due Fri 22:00): a fresh clone has no data/derived/ and no replay cache,
      # so the full replay of `make run` (T27) cannot run here until D-031 settles what may be committed.
      - name: make run replay with Suva-derived artefacts (blocked by D-031)
        if: ${{ false }}
        run: SERVE=0 MODE=replay make pipeline

  # Data layer (docs/DB_DDL_PLANNING.md §15.9, D-071): fresh deploy of src/db/sql on the pinned image, a second
  # deploy to prove idempotence, then the SQL tests of tests/sql (each rolled back). Throwaway database, reachable
  # only from this job: trust authentication, no password stored anywhere.
  db:
    runs-on: ubuntu-latest  # linux/amd64
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_DB: suva
          POSTGRES_USER: suva
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suva -d suva"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://suva@localhost:5432/suva
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install
        run: uv sync --frozen
      - name: psql client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Fresh deploy, then a second deploy (idempotence)
        run: make db-reset && make db-deploy
      - name: Structure equals expected/db/structure.json (the schema guard's reference)
        run: make db-structure
      - name: SQL tests
        run: make db-test
      - name: Python tests against PostgreSQL (layer 1 end to end, throwaway database)
        run: uv run --frozen pytest -m db

  # The cluster (docs/DEPLOY.md), end to end on linux/amd64: compose valid under every profile, app image built,
  # schema and logins deployed (schema guard), pipeline login proven least-privileged, then the whole chain on the
  # pinned base dataset (fetch, load with its closure check, make run: layer 1, golden, recall, self-verification;
  # migrate runs again on the same database, so the guard's "same" path is exercised too) and the release gate.
  # Secrets are generated for this run only (src/db/logins.py --init-env), never printed, gone with the runner.
  # The base dataset (925 MB) is cached outside the build context; the GPU profile is not exercised here.
  cluster:
    runs-on: ubuntu-latest  # linux/amd64
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Secrets for this run
        run: python3 -m src.db.logins --init-env .env
      - name: Base dataset location, outside the build context
        run: echo "HF_BASE_SOURCE=${{ runner.temp }}/hf" >> "$GITHUB_ENV"
      - name: Compose file valid, every profile
        run: make cluster-config
      - name: Build the app image
        run: make cluster-build
      - name: Schema and logins inside the cluster (db, then migrate)
        run: docker compose run --rm migrate
      - name: Pipeline login connects and cannot change the schema
        run: docker compose run --rm --no-deps --entrypoint python pipeline -m src.db.logins --verify suva_pipeline
      - name: Base dataset from the cache
        id: hf
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/hf
          key: hf-base-${{ hashFiles('src/ingest/fetch.py') }}  # the file that pins the revision and the SHA-256
      - name: Base dataset on a cache miss (the cluster's fetch job, pinned commit, SHA-256 checked)
        if: steps.hf.outputs.cache-hit != 'true'
        run: mkdir -p "$HF_BASE_SOURCE" && chmod 0777 "$HF_BASE_SOURCE" && docker compose run --rm fetch
      - name: End to end in the cluster (fetch, load and closure, make run with golden, recall and verify)
        run: docker compose run --rm pipeline
      - name: Release gate in the cluster (layer 1 on two profiles, recall, compare)
        run: make cluster-validate
      - name: Stop the cluster
        if: always()
        run: make cluster-down
